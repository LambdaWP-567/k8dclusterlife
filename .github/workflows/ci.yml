name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v 'node_modules')

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/testorch

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/app/package-lock.json"

      - name: Build main app
        working-directory: web/app
        run: npm ci && npm run build

      - name: Build test dashboard
        working-directory: web/testdash
        run: npm ci && npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build testorch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.testorch
          push: false

  e2e:
    name: E2E Tests (kind)
    runs-on: ubuntu-latest
    needs: [go-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: k8dclusterlife-test

      - name: Verify cluster
        run: kubectl cluster-info --context kind-k8dclusterlife-test

      - name: Set up Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          APP_URL: "http://localhost:8080"
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
