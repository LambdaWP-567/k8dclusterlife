{{- if .Values.rbac.create }}
---
# Role: read/write Secrets (kubeconfig storage)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8dclusterlife.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8dclusterlife.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8dclusterlife.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8dclusterlife.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8dclusterlife.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "k8dclusterlife.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
