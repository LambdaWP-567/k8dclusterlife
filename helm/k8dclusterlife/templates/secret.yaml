apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8dclusterlife.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8dclusterlife.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "k8dclusterlife.databaseURL" . | quote }}
  REDIS_ADDR: {{ include "k8dclusterlife.redisAddr" . | quote }}
  JWT_SECRET: {{ .Values.app.jwtSecret | quote }}
  CLAUDE_API_KEY: {{ .Values.healing.claudeApiKey | quote }}
  TEAMS_WEBHOOK_URL: {{ .Values.notifications.teamsWebhookUrl | quote }}
  ENTRA_CLIENT_ID: {{ .Values.auth.entraId.clientId | quote }}
  ENTRA_CLIENT_SECRET: {{ .Values.auth.entraId.clientSecret | quote }}
  ENTRA_TENANT_ID: {{ .Values.auth.entraId.tenantId | quote }}
  GITHUB_CLIENT_ID: {{ .Values.auth.github.clientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.auth.github.clientSecret | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.auth.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.auth.google.clientSecret | quote }}
